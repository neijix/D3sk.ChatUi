# Tag vX.Y.Z: both NuGet packages go to GitHub Packages (and nuget.org when NUGET_API_KEY is set),
# and @d3sk/chat-ui goes to npm when NPM_TOKEN is set, all with the tag's version.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Private repo: the owner's self-hosted runner only; a fork picks its own with CI_RUNS_ON.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "kyber"]') }}
    timeout-minutes: 20
    steps:
      - name: Keep the runner's home untouched
        run: |
          {
            echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet"
            echo "DOTNET_CLI_HOME=$RUNNER_TEMP/dotnet-home"
            echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget/packages"
            echo "NUGET_HTTP_CACHE_PATH=$RUNNER_TEMP/nuget/http"
            echo "NUGET_PLUGINS_CACHE_PATH=$RUNNER_TEMP/nuget/plugins"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test D3sk.ChatUi.slnx -c Release
      - name: Pack
        run: dotnet pack D3sk.ChatUi.slnx -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/neijix/index.json
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set: nuget.org skipped"
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  npm:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted", "kyber"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/chat-ui
    steps:
      - name: Keep the runner's home untouched
        run: echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Take the tag's version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set: npm skipped"
            exit 0
          fi
          npm publish --access public
